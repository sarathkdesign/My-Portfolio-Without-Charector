<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- GitHub Pages fallback for deep links (/work/branding/…): a copy of index.html with the base fixed.
       Page addresses (/work/branding/…) resolve every relative link from the site root.
       On GitHub Pages the site lives in the repo's sub-folder, so the base follows it there. -->
  <base href="/My-Portfolio-Without-Charector/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SARATH — Senior Designer</title>
  <meta name="description" content="Portfolio of SARATH, Senior Designer.">
  <meta name="theme-color" content="#eeebe1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=65">
  <link rel="stylesheet" href="css/pages.css?v=65">
  <link rel="stylesheet" href="css/designs.css?v=65">
  <script>document.documentElement.classList.add('js');</script>
  <script type="module" src="js/main.js?v=65"></script>
</head>
<body>
  <a class="skip" href="#about">Skip to introduction</a>

  <!-- The logo leads home from any page -->
  <a class="mark-link" href="./" data-route aria-label="Home">
    <img class="mark" src="public/logo/taraslogo.svg" alt="" width="44" height="44">
  </a>

  <!-- Sits early in the tab order so keyboard users reach the menu first -->
  <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu" data-menu-btn>
    <span class="sr-only" data-menu-label>Open menu</span>
    <span class="menu-btn__lines" aria-hidden="true"><i></i><i></i></span>
  </button>

  <main class="hero" id="main" aria-labelledby="hero-name">
    <div class="strip" id="work" data-strip role="region" aria-label="Work by category — scroll or drag to browse" tabindex="-1">
      <div class="strip__track" data-strip-track>
        <ul class="strip__set" data-strip-set></ul>
      </div>
    </div>

    <div class="hero__intro">
      <h1 class="wordmark" id="hero-name" data-wordmark>
        <span class="sr-only" data-content="name">SARATH</span>
        <span class="wordmark__text" aria-hidden="true" data-wordmark-text>SARATH</span>
      </h1>

      <div class="hero__copy" id="about" tabindex="-1">
        <p class="eyebrow">
          <span class="sr-only" data-content="role">Senior Designer</span>
          <span aria-hidden="true" data-scramble-source="role">Senior Designer</span>
        </p>
        <p class="hero__para" data-content="intro">[A brief bio.]</p>
      </div>
    </div>

    <footer class="bar">
      <div class="bar__group">
        <button class="toggle" type="button" data-sound aria-pressed="false" aria-label="Sound">
          <svg class="toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
            <path class="i-on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path class="i-off" d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span aria-hidden="true">Sound: <span data-sound-label>Off</span></span>
        </button>
        <span class="bar__sep" aria-hidden="true">|</span>
        <button class="toggle" type="button" data-motion aria-pressed="true" aria-label="Motion">
          <svg class="toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path class="i-on" d="M8 5.5v13l10-6.5z" fill="currentColor"/>
            <path class="i-off" d="M8 6h3v12H8zM13 6h3v12h-3z" fill="currentColor"/>
          </svg>
          <span aria-hidden="true">Motion: <span data-motion-label>On</span></span>
        </button>
      </div>
      <ul class="bar__group socials" data-socials>
        <li><a href="#">LinkedIn</a></li>
          <li><a href="#">Behance</a></li>
        <li><a href="#">Instagram</a></li>
      </ul>
    </footer>
  </main>

  <!-- ── Menu ──────────────────────────────────────────────── -->
  <div class="menu" id="menu" data-menu hidden>
    <div class="menu__scrim" data-menu-close></div>
    <nav class="menu__panel" aria-label="Main">
      <ul class="menu__list">
        <li><a href="#work" data-menu-link="work">Work</a></li>
        <li><a href="experience" data-route data-menu-link>Experience</a></li>
        <li><a href="contact" data-route data-menu-link class="is-accent">Let’s talk</a></li>
      </ul>
      <ul class="socials menu__socials" data-socials>
        <li><a href="#">LinkedIn</a></li>
        <li><a href="#">Instagram</a></li>
      </ul>
    </nav>
  </div>

  <!-- ── Category and project pages (drawn by js/pages.js) ──── -->
  <section class="page page--category" data-page="category" hidden></section>
  <article class="page page--project" data-page="project" hidden></article>
  <div class="morph-layer" aria-hidden="true" data-morph-layer></div>

  <div class="chip" aria-hidden="true" data-chip><span>Explore</span></div>

  <!-- WebGL paint layer for the opening (see js/surface.js); purely visual -->
  <canvas class="surface" aria-hidden="true" data-surface></canvas>
</body>
</html>
